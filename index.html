<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Dentaworth provides Florida dental ratings and cash price range estimates for common dental procedures."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Florida dental ratings and cost guide | Dentaworth" />
    <meta
      property="og:description"
      content="Compare county-level dental ratings and cash price range estimates across Florida."
    />
    <meta name="theme-color" content="#071c40" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400..800&family=Source+Serif+4:opsz,wght@8..60,400..700&display=swap"
    />
    <script>
      // Enable scroll entrances before first paint so content never flashes in.
      // src/motion/motion.ts removes this again for reduced-motion visitors.
      if ("IntersectionObserver" in window && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        document.documentElement.classList.add("motion-ok");
      }
    </script>
    <title>Florida dental ratings and cost guide | Dentaworth</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
